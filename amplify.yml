version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - cd server && npm ci && cd ..
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - server/node_modules/**/*
